name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests + lint (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Release gate: this job runs on every push, PR and tag, so the check exists
      # on the exact commit being released. Policy: DEPENDENCIES.md.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency audit (blocks release)
        run: cargo audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all --release

  windows:
    name: Windows build + tests + self-test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests on real Windows
        run: cargo test --all --release

      - name: Build console variant and run the app's self-test
        shell: pwsh
        run: |
          cargo build --release --features console
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          .\target\release\kilobyt.exe -selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed with exit code $LASTEXITCODE" }

      - name: Build release exe (no console window)
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }
          Copy-Item target\release\kilobyt.exe Kilobyt.exe -Force
          Get-Item Kilobyt.exe | Select-Object Name, Length

      - name: Assert the Common Controls v6 manifest is embedded
        shell: pwsh
        run: |
          # Without this the app silently falls back to Windows-95 style controls.
          $bytes = [System.IO.File]::ReadAllBytes("Kilobyt.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'Microsoft\.Windows\.Common-Controls') {
            throw "manifest missing: comctl32 v6 not declared, refusing to release"
          }
          Write-Host "manifest present"

      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path Kilobyt.exe -DestinationPath "Kilobyt-$ver-win-x64.zip" -Force
          $h = (Get-FileHash Kilobyt.exe -Algorithm SHA256).Hash.ToLower()
          $z = (Get-FileHash "Kilobyt-$ver-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  Kilobyt.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          "$z  Kilobyt-$ver-win-x64.zip" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: kilobytes-win-x64
          path: |
            Kilobyt.exe
            Kilobyt-*-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kilobytes-win-x64
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          find release -type f -printf '%p %s bytes\n'
          mapfile -t ASSETS < <(find release -type f \( -name 'Kilobyt.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' \))
          if [ ${#ASSETS[@]} -lt 3 ]; then echo "expected 3 assets, found ${#ASSETS[@]}"; exit 1; fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Kilobyt $TAG" \
            --notes-file RELEASE_NOTES.md
