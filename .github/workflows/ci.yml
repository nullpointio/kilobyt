name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-linux:
    name: Core unit tests (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/Kilobyt.Core.Tests/Kilobyt.Core.Tests.csproj

      - name: Test
        run: dotnet test tests/Kilobyt.Core.Tests/Kilobyt.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

  build-windows:
    name: Windows build + integration tests
    runs-on: windows-latest
    needs: unit-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Integration tests (real System.Drawing encoder, real files)
        run: dotnet test tests/Kilobyt.App.Tests/Kilobyt.App.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish single-file exe
        shell: pwsh
        run: |
          # NuGet versions cannot carry the leading "v" of the tag (v1.0.0 -> 1.0.0).
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          Write-Host "publishing version $ver"
          dotnet publish src/Kilobyt.App/Kilobyt.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=$ver `
            -o publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $exe = "publish/Kilobyt.exe"
          if (-not (Test-Path $exe)) { throw "Kilobyt.exe was not produced" }
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path $exe -DestinationPath "Kilobyt-$ver-win-x64.zip" -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $ziphash = (Get-FileHash "Kilobyt-$ver-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Kilobyt.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          "$ziphash  Kilobyt-$ver-win-x64.zip" | Out-File -Encoding ascii -Append SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Get-Item $exe, "Kilobyt-$ver-win-x64.zip" | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kilobytes-win-x64
          path: |
            publish/Kilobyt.exe
            Kilobyt-*-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kilobytes-win-x64
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # download-artifact preserves the uploaded relative paths, so the exe may sit in a
          # subdirectory. Collect every file instead of guessing the layout.
          find release -type f -printf '%p %s bytes\n'
          mapfile -t ASSETS < <(find release -type f \( -name 'Kilobyt.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' \))
          if [ ${#ASSETS[@]} -lt 3 ]; then echo "expected 3 assets, found ${#ASSETS[@]}"; exit 1; fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Kilobyt $TAG" \
            --notes-file RELEASE_NOTES.md
