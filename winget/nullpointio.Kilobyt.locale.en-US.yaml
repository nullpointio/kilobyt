ShortDescription: Offline utility that makes a photo provably fit a hard upload limit (exact KB and max pixels). Nothing is
  uploaded.
Description: 'Kilobyt writes a JPEG at or under the exact byte limit you type in, or writes nothing and tells you the smallest
  size that is achievable. The binary contains no network code: no update check, no telemetry, no upload path. Single portable
  exe, no installer and no runtime.'
