<!-- Kilobyt app icon — 64x64 master.
   Metaphor: a photo card with a downward arrow (compress / fit the limit).
   Flat shapes only so every edge stays crisp at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="14.5" fill="#101528"/>

  <!-- the photo: paper-white card held near the top of the tile -->
  <rect x="12.5" y="8.5" width="39" height="27" rx="5" fill="#FBFCFF"/>

  <!-- a photo, not a document: sun + ridge, tinted so 16 px stays clean -->
  <circle cx="22.5" cy="17.5" r="2.8" fill="#D7DBF7"/>
  <path d="M16 31 L25 21.5 L31 28 L35.5 23.5 L44 31 Z" fill="#D7DBF7"/>

  <!-- the arrow: drops out of the photo and past its lower edge -->
  <path d="M32 27 V46" stroke="#101528" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M22.4 42.4 L32 56 L41.6 42.4 Z" fill="#7C86FF"
        stroke="#101528" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M32 27 V45.5" stroke="#7C86FF" stroke-width="5.6" stroke-linecap="round" fill="none"/>
</svg>
